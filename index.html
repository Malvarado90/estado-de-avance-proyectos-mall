<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estado de Avance · Proyectos Inmersivos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F14;
    --bg-alt:#0F141B;
    --surface:#141A22;
    --surface-2:#1A222D;
    --border:#262F3B;
    --border-soft:#1E2630;
    --text:#E7EDF4;
    --text-dim:#8C97A7;
    --text-faint:#5A6473;
    --crit:#F0554B;
    --crit-bg:rgba(240,85,75,0.13);
    --warn:#EFA23A;
    --warn-bg:rgba(239,162,58,0.13);
    --ok:#33C48E;
    --ok-bg:rgba(51,196,142,0.13);
    --info:#4C9AFF;
    --info-bg:rgba(76,154,255,0.13);
    --block:#A371F7;
    --block-bg:rgba(163,113,247,0.13);
    --neutral:#5A6473;
    --neutral-bg:rgba(90,100,115,0.16);
    --font-display:'Space Grotesk',system-ui,sans-serif;
    --font-body:'Inter',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
  body{
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(76,154,255,0.08), transparent),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(163,113,247,0.06), transparent);
    background-attachment:fixed;
    min-height:100vh;
    padding-bottom:60px;
  }
  a{color:inherit;}
  ::selection{background:var(--info);color:#fff;}

  /* ---------- Header ---------- */
  .topbar{
    padding:28px clamp(16px,4vw,48px) 18px;
    border-bottom:1px solid var(--border-soft);
    display:flex; flex-wrap:wrap; gap:16px; justify-content:space-between; align-items:flex-end;
  }
  .brand-eyebrow{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--info); margin:0 0 6px;
  }
  .brand-title{
    font-family:var(--font-display); font-weight:700; font-size:clamp(22px,3vw,32px);
    margin:0; letter-spacing:-0.01em;
  }
  .brand-sub{
    color:var(--text-dim); font-size:13px; margin-top:6px; font-family:var(--font-mono);
  }
  .clock-chip{
    font-family:var(--font-mono); font-size:12px; color:var(--text-dim);
    border:1px solid var(--border); background:var(--surface); border-radius:100px;
    padding:8px 14px; display:flex; align-items:center; gap:8px; white-space:nowrap;
  }
  .clock-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg);}

  /* ---------- KPI strip ---------- */
  .kpi-strip{
    display:grid; grid-template-columns:repeat(5,1fr); gap:12px;
    padding:20px clamp(16px,4vw,48px) 0;
  }
  @media (max-width:900px){ .kpi-strip{grid-template-columns:repeat(2,1fr);} }
  .kpi-card{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:14px;
    padding:16px 18px; position:relative; overflow:hidden;
  }
  .kpi-card .label{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; font-family:var(--font-mono);}
  .kpi-card .value{font-family:var(--font-display); font-size:28px; font-weight:700; margin-top:6px; line-height:1.1;}
  .kpi-card .value small{font-size:14px; font-weight:500; color:var(--text-dim); font-family:var(--font-mono);}
  .kpi-card.accent-crit{border-color:rgba(240,85,75,0.35);}
  .kpi-card.accent-crit .value{color:var(--crit);}
  .kpi-card.accent-info .value{color:var(--info);}

  /* ---------- Tabs ---------- */
  .tabbar{
    display:flex; gap:6px; padding:22px clamp(16px,4vw,48px) 0; flex-wrap:wrap;
    border-bottom:1px solid var(--border-soft); margin-bottom:4px;
  }
  .tab-btn{
    font-family:var(--font-body); font-weight:600; font-size:13.5px; color:var(--text-dim);
    background:transparent; border:none; padding:10px 4px; margin-bottom:-1px; cursor:pointer;
    border-bottom:2px solid transparent; display:flex; align-items:center; gap:8px;
    transition:color .15s ease, border-color .15s ease;
  }
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{color:var(--text); border-bottom-color:var(--info);}
  .tab-btn .tag{
    font-family:var(--font-mono); font-size:10px; padding:2px 7px; border-radius:100px;
    background:var(--neutral-bg); color:var(--text-dim);
  }
  .tab-btn.active .tag.crit{background:var(--crit-bg); color:var(--crit);}
  .tab-btn .tag.crit{background:var(--crit-bg); color:var(--crit);}
  .tab-btn .tag.block{background:var(--block-bg); color:var(--block);}

  .panel{padding:24px clamp(16px,4vw,48px) 8px; display:none;}
  .panel.active{display:block; animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- Section heading ---------- */
  .section-head{display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:10px; margin:26px 0 14px;}
  .section-head h2{font-family:var(--font-display); font-size:16px; margin:0; font-weight:600; letter-spacing:.01em;}
  .section-head .hint{font-size:12px; color:var(--text-faint); font-family:var(--font-mono);}
  .section-head:first-child{margin-top:0;}

  /* ---------- Pills / badges ---------- */
  .pill{
    display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600;
    padding:4px 10px; border-radius:100px; font-family:var(--font-body); white-space:nowrap;
  }
  .pill::before{content:''; width:6px; height:6px; border-radius:50%; background:currentColor;}
  .pill.crit{background:var(--crit-bg); color:var(--crit);}
  .pill.warn{background:var(--warn-bg); color:var(--warn);}
  .pill.ok{background:var(--ok-bg); color:var(--ok);}
  .pill.info{background:var(--info-bg); color:var(--info);}
  .pill.block{background:var(--block-bg); color:var(--block);}
  .pill.neutral{background:var(--neutral-bg); color:var(--text-dim);}

  /* ---------- Resumen: project cards ---------- */
  .resumen-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px;}
  .proj-card{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:16px; padding:20px;
    display:flex; flex-direction:column; gap:14px;
  }
  .proj-card .pc-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .proj-card h3{font-family:var(--font-display); font-size:16px; margin:0; font-weight:600;}
  .progress-track{height:8px; border-radius:100px; background:var(--surface-2); overflow:hidden; border:1px solid var(--border-soft);}
  .progress-fill{height:100%; border-radius:100px; background:linear-gradient(90deg,var(--info),var(--ok));}
  .progress-row{display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:11px; color:var(--text-dim);}
  .kv-line{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; padding:7px 0; border-top:1px dashed var(--border-soft);}
  .kv-line .k{color:var(--text-dim);}
  .kv-line .v{font-family:var(--font-mono); text-align:right;}
  .risk-box{
    background:var(--bg-alt); border:1px solid var(--border-soft); border-left:3px solid var(--warn);
    border-radius:8px; padding:10px 12px; font-size:12.5px; color:var(--text-dim); line-height:1.5;
  }
  .risk-box.crit{border-left-color:var(--crit);}
  .risk-box.block{border-left-color:var(--block);}

  /* ---------- Gantt ---------- */
  .gantt-wrap{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:16px;
    padding:18px 20px 12px; overflow-x:auto;
  }
  .gantt-scale{position:relative; height:22px; margin-bottom:6px; font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); min-width:640px;}
  .gantt-scale span{position:absolute; transform:translateX(-50%); top:0;}
  .gantt-row{position:relative; height:30px; min-width:640px;}
  .gantt-row .lbl{
    position:absolute; left:0; top:50%; transform:translateY(-50%);
    font-size:11.5px; color:var(--text-dim); width:100%; pointer-events:none; z-index:2;
    padding-left:6px; line-height:30px; display:none;
  }
  .gantt-track{position:relative; height:100%; background:var(--bg-alt); border-radius:6px;}
  .gantt-bar{
    position:absolute; top:6px; height:18px; border-radius:5px; cursor:default;
    display:flex; align-items:center; overflow:hidden;
    box-shadow:0 0 0 1px rgba(255,255,255,0.04) inset;
  }
  .gantt-bar span{
    font-size:10px; font-family:var(--font-mono); white-space:nowrap; padding-left:7px; color:rgba(0,0,0,0.65); font-weight:600;
  }
  .gantt-bar.hito{border-radius:3px; transform:skewX(-18deg);}
  .gantt-bar.hito span{transform:skewX(18deg); display:none;}
  .g-crit{background:var(--crit);} .g-warn{background:var(--warn);} .g-ok{background:var(--ok);}
  .g-info{background:#5FB0E0;} .g-neutral{background:#3A4454;}
  .gantt-today{
    position:absolute; top:0; bottom:0; width:2px; background:var(--info); z-index:3;
  }
  .gantt-today::after{
    content:'HOY'; position:absolute; top:-18px; left:50%; transform:translateX(-50%);
    font-size:9px; font-family:var(--font-mono); color:var(--info); letter-spacing:.05em;
  }
  .gantt-legend{display:flex; flex-wrap:wrap; gap:14px; margin-top:14px; padding-top:12px; border-top:1px solid var(--border-soft);}
  .gantt-legend .item{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-dim); font-family:var(--font-mono);}
  .gantt-legend .sw{width:10px; height:10px; border-radius:3px;}
  .gantt-rows{display:flex; flex-direction:column; gap:4px; margin-top:4px;}

  /* ---------- Filter chips ---------- */
  .filter-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .chip{
    font-family:var(--font-mono); font-size:11.5px; padding:6px 13px; border-radius:100px;
    border:1px solid var(--border); background:var(--surface); color:var(--text-dim); cursor:pointer;
    transition:all .15s ease;
  }
  .chip:hover{border-color:var(--info); color:var(--text);}
  .chip.active{background:var(--info-bg); border-color:var(--info); color:var(--info);}

  /* ---------- Task list ---------- */
  .task-list{display:flex; flex-direction:column; gap:8px;}
  .task-row{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:12px;
    padding:13px 16px; display:grid; grid-template-columns:28px 1.6fr 1fr 1fr 100px; gap:14px; align-items:center;
  }
  .task-row.hito{border-left:3px solid var(--block);}
  @media (max-width:820px){
    .task-row{grid-template-columns:1fr; gap:8px;}
    .task-row .t-item{display:none;}
  }
  .t-item{font-family:var(--font-mono); font-size:11px; color:var(--text-faint); text-align:center;}
  .t-main .t-name{font-size:13.5px; font-weight:600;}
  .t-main .t-comment{font-size:11.5px; color:var(--text-dim); margin-top:3px; line-height:1.4;}
  .t-dates{font-family:var(--font-mono); font-size:11px; color:var(--text-dim); line-height:1.6;}
  .t-dates b{color:var(--text); font-weight:500;}
  .t-dates .real{color:var(--info);}
  .t-atraso{font-family:var(--font-mono); font-size:11px; color:var(--text-dim);}
  .t-status{display:flex; justify-content:flex-end;}
  @media (max-width:820px){ .t-status{justify-content:flex-start;} }

  /* ---------- Escenarios ---------- */
  .scenario-table{width:100%; border-collapse:collapse; font-size:12.5px;}
  .scenario-table th,.scenario-table td{padding:11px 12px; text-align:left; border-bottom:1px solid var(--border-soft);}
  .scenario-table th{font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); font-weight:500;}
  .scenario-table td.num{font-family:var(--font-mono);}
  .scenario-table tr:last-child td{border-bottom:none;}
  .scenario-table tbody tr:hover{background:var(--surface-2);}
  .table-wrap{background:var(--surface); border:1px solid var(--border-soft); border-radius:16px; padding:6px 20px; overflow-x:auto;}
  .apertura-compare{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:20px;}
  @media (max-width:700px){ .apertura-compare{grid-template-columns:1fr;} }
  .apertura-card{background:var(--surface); border:1px solid var(--border-soft); border-radius:14px; padding:18px; text-align:center;}
  .apertura-card .tag{font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim);}
  .apertura-card .date{font-family:var(--font-display); font-size:22px; font-weight:700; margin-top:8px;}
  .apertura-card.optimo{border-color:rgba(51,196,142,0.35);}
  .apertura-card.optimo .date{color:var(--ok);}
  .apertura-card.agresivo{border-color:rgba(76,154,255,0.35);}
  .apertura-card.agresivo .date{color:var(--info);}

  /* ---------- Presupuesto ---------- */
  .budget-kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:16px;}
  .budget-kpi{background:var(--surface); border:1px solid var(--border-soft); border-radius:14px; padding:14px 16px;}
  .budget-kpi .label{font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.07em; font-family:var(--font-mono);}
  .budget-kpi .value{font-family:var(--font-display); font-size:20px; font-weight:700; margin-top:6px;}
  .budget-table td.partida{max-width:260px;}
  .budget-table tr.total-row td{border-top:1px solid var(--border); font-weight:700; color:var(--text); background:var(--surface-2);}
  .exec-bar{width:100%; height:5px; border-radius:100px; background:var(--surface-2); margin-top:4px; overflow:hidden;}
  .exec-bar-fill{height:100%; background:var(--info); border-radius:100px;}
  .budget-note{font-size:11.5px; color:var(--text-faint); font-family:var(--font-mono); margin:-4px 0 16px;}

  footer{padding:30px clamp(16px,4vw,48px) 10px; color:var(--text-faint); font-size:11px; font-family:var(--font-mono); text-align:center;}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <p class="brand-eyebrow">2° semestre 2026</p>
    <h1 class="brand-title">Estado de Avance — Proyectos Inmersivos</h1>
    <p class="brand-sub" id="brandSub">Actualizado al —</p>
  </div>
  <div class="clock-chip"><span class="clock-dot"></span><span id="clockText">—</span></div>
</div>

<div class="kpi-strip" id="kpiStrip"></div>

<div class="tabbar" id="tabbar"></div>

<div id="panels"></div>

<footer>Datos: estado_avance_proyectos_2do_sem_2026_rev2.xlsx — este panel se genera a partir de una copia estática del archivo.</footer>

<script>
let DATA = null;

const ESTADO_COLOR = {
  'Completado':'ok', 'En Curso':'info', 'Atrasado':'crit', 'Pendiente':'neutral',
  'Bloqueado':'block'
};
const ALERTA_COLOR = {
  'Completado':'ok', 'En plazo':'ok', 'Atención':'warn', 'Crítico':'crit', 'Bloqueado':'block'
};
const GANTT_COLOR = { 'Completado':'g-info', 'En plazo':'g-ok', 'Atención':'g-warn', 'Crítico':'g-crit', 'Bloqueado':'g-neutral' };

function pillHtml(text, colorClass){
  return `<span class="pill ${colorClass}">${text}</span>`;
}
function fmtDate(iso){
  if(!iso || iso==='—') return '—';
  const [y,m,d] = iso.split('-');
  const meses=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${parseInt(d)} ${meses[parseInt(m)-1]}`;
}
function fmtDateFull(iso){
  if(!iso || iso==='—') return '—';
  const [y,m,d] = iso.split('-');
  const meses=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${parseInt(d)} ${meses[parseInt(m)-1]} ${y}`;
}
function daysBetween(a,b){
  return Math.round((new Date(b) - new Date(a)) / 86400000);
}

/* ---------------- KPI strip ---------------- */
function renderKpis(){
  const k = DATA.resumen.kpis;
  const items = [
    {label:'Proyectos activos', value:k.activos, accent:''},
    {label:'En curso', value:k.en_curso, accent:'accent-info'},
    {label:'Tareas atrasadas', value:k.atrasadas, accent:'accent-crit'},
    {label:'Próxima apertura', value:fmtDateFull(k.proxima_apertura), accent:'accent-info', small:true},
    {label:'Atraso máx (d)', value:k.atraso_max, accent:'accent-crit'},
  ];
  document.getElementById('kpiStrip').innerHTML = items.map(it => `
    <div class="kpi-card ${it.accent}">
      <div class="label">${it.label}</div>
      <div class="value" style="${it.small?'font-size:18px':''}">${it.value}</div>
    </div>
  `).join('');
}

/* ---------------- Tabs ---------------- */
const TABS = [
  {id:'resumen', label:'Resumen'},
  {id:'mpo', label:'Mall Plaza Oeste'},
  {id:'mpn', label:'Mall Plaza Norte'},
  {id:'mpld', label:'Mall Plaza Los Dominicos'},
  {id:'escenarios', label:'Escenarios de apertura'},
];
function renderTabs(){
  document.getElementById('tabbar').innerHTML = TABS.map(t=>`<button class="tab-btn" data-tab="${t.id}">${t.label}</button>`).join('');
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> activateTab(btn.dataset.tab));
  });
}
function activateTab(id){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===id));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+id));
}

/* ---------------- Resumen panel ---------------- */
function renderResumenPanel(){
  const cards = DATA.resumen.proyectos.map(p=>{
    const pct = Math.round(p.avance*100);
    const estadoColor = ESTADO_COLOR[p.estado] || 'neutral';
    const riskClass = p.estado==='Bloqueado' ? 'block' : (p.atraso_max>=15 ? 'crit' : '');
    return `
    <div class="proj-card">
      <div class="pc-head">
        <h3>${p.nombre}</h3>
        ${pillHtml(p.estado, estadoColor)}
      </div>
      <div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-row"><span>Avance</span><span>${pct}%</span></div>
      </div>
      <div>
        <div class="kv-line"><span class="k">Fase actual</span><span class="v">${p.fase_actual}</span></div>
        <div class="kv-line"><span class="k">Próxima actividad</span><span class="v">${p.proxima_actividad}</span></div>
        <div class="kv-line"><span class="k">Fecha</span><span class="v">${fmtDateFull(p.fecha)}</span></div>
        <div class="kv-line"><span class="k">Apertura plan</span><span class="v">${fmtDateFull(p.apertura_plan)}</span></div>
        <div class="kv-line"><span class="k">Apertura proyectada</span><span class="v">${fmtDateFull(p.apertura_proyectada)}</span></div>
        <div class="kv-line"><span class="k">Desvío / Atraso máx</span><span class="v">${p.desvio}d / ${p.atraso_max}d</span></div>
      </div>
      <div class="risk-box ${riskClass}">${p.riesgo}</div>
    </div>`;
  }).join('');
  return `<div class="section-head"><h2>Estado por proyecto</h2><span class="hint">3 proyectos activos</span></div>
  <div class="resumen-grid">${cards}</div>`;
}

/* ---------------- Gantt ---------------- */
function buildGantt(tasks, rangeStart, rangeEnd, today){
  const totalDays = daysBetween(rangeStart, rangeEnd) || 1;
  const pct = (iso) => (daysBetween(rangeStart, iso) / totalDays) * 100;
  // scale ticks: ~6 ticks across range
  const ticks = [];
  const tickCount = 6;
  for(let i=0;i<=tickCount;i++){
    const dt = new Date(rangeStart);
    dt.setDate(dt.getDate() + Math.round(totalDays*i/tickCount));
    const iso = dt.toISOString().slice(0,10);
    ticks.push({left: (i/tickCount)*100, label: fmtDate(iso)});
  }
  const todayPct = (today >= rangeStart && today <= rangeEnd) ? pct(today) : null;

  const rows = tasks.map(t=>{
    const isHito = t.tipo === 'Hito';
    const start = t.inicio_prev, end = t.fin_prev || t.inicio_prev;
    const left = Math.max(0, pct(start));
    let width = Math.max(isHito ? 1.2 : 0.8, pct(end) - pct(start));
    const colorClass = GANTT_COLOR[t.alerta] || 'g-neutral';
    return `<div class="gantt-row" title="${t.tarea}">
      <div class="gantt-track">
        <div class="gantt-bar ${isHito?'hito':''} ${colorClass}" style="left:${left}%; width:${width}%;">
          <span>${t.tarea}</span>
        </div>
      </div>
    </div>`;
  }).join('');

  return `<div class="gantt-wrap">
    <div class="gantt-scale">${ticks.map(tk=>`<span style="left:${tk.left}%">${tk.label}</span>`).join('')}</div>
    <div class="gantt-rows" style="position:relative;">
      ${todayPct!==null ? `<div class="gantt-today" style="left:${todayPct}%"></div>` : ''}
      ${rows}
    </div>
    <div class="gantt-legend">
      <div class="item"><span class="sw g-info"></span>Completado</div>
      <div class="item"><span class="sw g-ok"></span>En plazo</div>
      <div class="item"><span class="sw g-warn"></span>Atención</div>
      <div class="item"><span class="sw g-crit"></span>Crítico</div>
      <div class="item"><span class="sw g-neutral" style="transform:skewX(-18deg)"></span>Hito</div>
    </div>
  </div>`;
}

/* ---------------- Task list with filters ---------------- */
function taskRowHtml(t){
  const isHito = t.tipo==='Hito';
  const alertaColor = ALERTA_COLOR[t.alerta] || 'neutral';
  const atrasoTxt = (t.atraso_inicio || t.atraso_fin)
    ? `Iaraso: ${t.atraso_inicio>0?'+':''}${t.atraso_inicio}d · Fin: ${t.atraso_fin>0?'+':''}${t.atraso_fin}d`.replace('Iaraso','Inicio')
    : 'Sin desvío';
  return `<div class="task-row ${isHito?'hito':''}" data-estado="${t.estado}" data-alerta="${t.alerta}">
    <div class="t-item">${t.item ?? ''}</div>
    <div class="t-main">
      <div class="t-name">${isHito?'◆ ':''}${t.tarea}</div>
      ${t.comentario ? `<div class="t-comment">${t.comentario}</div>` : ''}
    </div>
    <div class="t-dates">
      Previsto: <b>${fmtDate(t.inicio_prev)} → ${fmtDate(t.fin_prev)}</b><br>
      Real: <span class="real">${t.inicio_real?fmtDate(t.inicio_real):'—'} → ${t.fin_real?fmtDate(t.fin_real):'—'}</span>
    </div>
    <div class="t-atraso">${atrasoTxt}</div>
    <div class="t-status">${pillHtml(t.estado, ESTADO_COLOR[t.estado]||alertaColor)}</div>
  </div>`;
}

function renderTaskSection(id, title, tasks){
  const filters = ['Todas','Crítico','Atención','Atrasado','En Curso','Completado','Pendiente'];
  return `<div class="section-head"><h2>${title}</h2><span class="hint">${tasks.length} ítems</span></div>
  <div class="filter-row" id="filters-${id}">
    ${filters.map((f,i)=>`<button class="chip ${i===0?'active':''}" data-filter="${f}">${f}</button>`).join('')}
  </div>
  <div class="task-list" id="list-${id}">
    ${tasks.map(taskRowHtml).join('')}
  </div>`;
}

function wireFilters(id, tasks){
  const container = document.getElementById('filters-'+id);
  const list = document.getElementById('list-'+id);
  container.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      container.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      const f = chip.dataset.filter;
      list.querySelectorAll('.task-row').forEach(row=>{
        let show = true;
        if(f==='Crítico') show = row.dataset.alerta==='Crítico';
        else if(f==='Atención') show = row.dataset.alerta==='Atención';
        else if(f!=='Todas') show = row.dataset.estado===f;
        row.style.display = show ? '' : 'none';
      });
    });
  });
}

/* ---------------- Presupuesto (CAPEX) ---------------- */
function fmtCLP(n){
  if(n===null || n===undefined) return '—';
  return '$' + Math.round(n).toLocaleString('es-CL');
}
function renderBudgetSection(presupuesto){
  const { partidas, total } = presupuesto;
  const pctEjecutado = total.real / total.ppto * 100;
  const rows = partidas.map(p=>{
    const isNum = typeof p.desviacion === 'number';
    const desvColor = isNum ? (p.desviacion > 0 ? 'crit' : (p.desviacion < 0 ? 'ok' : 'neutral')) : 'neutral';
    const desvTxt = isNum ? fmtCLP(p.desviacion) : p.desviacion;
    const execPct = (p.ppto && p.real) ? Math.min(100, (p.real/p.ppto)*100) : 0;
    return `<tr>
      <td class="partida">${p.partida}
        ${p.ppto ? `<div class="exec-bar"><div class="exec-bar-fill" style="width:${execPct}%"></div></div>` : ''}
      </td>
      <td class="num">${fmtCLP(p.ppto)}</td>
      <td class="num">${p.real!==null ? fmtCLP(p.real) : '—'}</td>
      <td class="num" style="color:var(--${desvColor==='neutral'?'text-dim':desvColor})">${desvTxt}</td>
    </tr>`;
  }).join('');

  return `
  <div class="section-head" style="margin-top:36px;">
    <h2>Presupuesto (CAPEX) — Mall Plaza Oeste</h2>
    <span class="hint">único proyecto con presupuesto cargado</span>
  </div>
  <div class="budget-kpis">
    <div class="budget-kpi"><div class="label">Ppto. ajustado total</div><div class="value">${fmtCLP(total.ppto)}</div></div>
    <div class="budget-kpi"><div class="label">Ejecutado (real)</div><div class="value" style="color:var(--info)">${fmtCLP(total.real)}</div></div>
    <div class="budget-kpi"><div class="label">Desviación total</div><div class="value" style="color:${total.desviacion<0?'var(--ok)':'var(--crit)'}">${fmtCLP(total.desviacion)}</div></div>
    <div class="budget-kpi"><div class="label">% ejecutado</div><div class="value">${pctEjecutado.toFixed(1)}%</div></div>
  </div>
  <div class="budget-note">Desviación = Real − Ajustado · negativo (verde) = eficiencia/ahorro · positivo (rojo) = sobrecosto</div>
  <div class="table-wrap">
    <table class="scenario-table budget-table">
      <thead><tr><th>Partida</th><th>Ppto. ajustado</th><th>Real</th><th>Desviación</th></tr></thead>
      <tbody>
        ${rows}
        <tr class="total-row">
          <td class="partida">${total.partida}</td>
          <td class="num">${fmtCLP(total.ppto)}</td>
          <td class="num">${fmtCLP(total.real)}</td>
          <td class="num" style="color:${total.desviacion<0?'var(--ok)':'var(--crit)'}">${fmtCLP(total.desviacion)}</td>
        </tr>
      </tbody>
    </table>
  </div>`;
}

/* ---------------- Project panel ---------------- */
function renderProjectPanel(key, label){
  const p = DATA.proyectos[key];
  const today = DATA.meta.hoy;
  const allTasks = [...p.cronograma, ...p.comercial];
  const dates = allTasks.flatMap(t=>[t.inicio_prev,t.fin_prev]).filter(Boolean);
  let rangeStart = dates.reduce((a,b)=> a<b?a:b);
  let rangeEnd = dates.reduce((a,b)=> a>b?a:b);
  if(today > rangeEnd) rangeEnd = today;

  const estadoColor = ESTADO_COLOR[p.estado] || 'neutral';
  const alertaColor = ALERTA_COLOR[p.alerta] || 'neutral';

  return `
  <div class="section-head">
    <h2>${label} — cronograma técnico</h2>
    <span class="hint">Inicio ${fmtDateFull(p.inicio)} · Fin previsto ${fmtDateFull(p.fin_prev)} · ${p.duracion} días</span>
  </div>
  <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;">
    ${pillHtml('Estado: '+p.estado, estadoColor)}
    ${pillHtml('Alerta: '+p.alerta, alertaColor)}
    ${p.fin_real ? pillHtml('Fin real (proy.): '+fmtDate(p.fin_real), 'info') : ''}
  </div>
  ${buildGantt(p.cronograma, rangeStart, rangeEnd, today)}
  <div style="margin-top:22px;">${renderTaskSection(key+'-cron', 'Detalle de tareas — cronograma técnico', p.cronograma)}</div>

  <div class="section-head" style="margin-top:36px;"><h2>${label} — plan comercial</h2></div>
  ${renderTaskSection(key+'-com', 'Detalle de tareas — plan comercial', p.comercial)}

  ${p.presupuesto ? renderBudgetSection(p.presupuesto) : ''}
  `;
}

/* ---------------- Escenarios panel ---------------- */
function renderEscenariosPanel(){
  const e = DATA.escenarios;
  const controlColor = {'OBLIGATORIO':'crit','NO NEGOCIABLE':'block','MANEJABLE':'ok'};
  const etapaRows = e.etapas.map(r=>{
    const isDate = /^\d{4}-\d{2}-\d{2}$/.test(String(r.actual));
    const fmt = v => isDate ? fmtDate(v) : v+'d';
    return `<tr>
      <td>${r.etapa}</td>
      <td class="num">${fmt(r.actual)}</td>
      <td class="num" style="color:var(--ok)">${fmt(r.optimo)}</td>
      <td class="num" style="color:var(--info)">${fmt(r.agresivo)}</td>
      <td>${pillHtml(r.control, controlColor[r.control]||'neutral')}</td>
      <td style="color:var(--text-dim); font-size:12px;">${r.exigencia}</td>
    </tr>`;
  }).join('');

  const dotacionRows = e.dotacion.map(r=>`
    <tr>
      <td>${r.concepto}</td>
      <td class="num">${r.actual ?? '—'}</td>
      <td class="num" style="color:var(--ok)">${r.optimo ?? '—'}</td>
      <td class="num" style="color:var(--info)">${r.agresivo ?? '—'}</td>
      <td class="num">${r.unidad}</td>
      <td style="color:var(--text-dim); font-size:12px;">${r.nota||''}</td>
    </tr>`).join('');

  return `
  <div class="section-head"><h2>Mall Plaza Oeste — escenarios de apertura</h2></div>
  <div class="apertura-compare">
    <div class="apertura-card"><div class="tag">Actual</div><div class="date">${fmtDateFull(e.apertura.actual)}</div></div>
    <div class="apertura-card optimo"><div class="tag">Óptimo</div><div class="date">${fmtDateFull(e.apertura.optimo)}</div></div>
    <div class="apertura-card agresivo"><div class="tag">Agresivo</div><div class="date">${fmtDateFull(e.apertura.agresivo)}</div></div>
  </div>
  <div class="table-wrap">
    <table class="scenario-table">
      <thead><tr><th>Etapa</th><th>Actual</th><th>Óptimo</th><th>Agresivo</th><th>Control</th><th>Exigencia</th></tr></thead>
      <tbody>${etapaRows}</tbody>
    </table>
  </div>

  <div class="section-head" style="margin-top:32px;"><h2>Armado en doble turno — dotación necesaria</h2></div>
  <div class="table-wrap">
    <table class="scenario-table">
      <thead><tr><th>Concepto</th><th>Actual</th><th>Óptimo</th><th>Agresivo</th><th>Unidad</th><th>Nota</th></tr></thead>
      <tbody>${dotacionRows}</tbody>
    </table>
  </div>`;
}

/* ---------------- Boot ---------------- */
async function boot(){
  try{
    const res = await fetch('data.json', {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    DATA = await res.json();
  }catch(err){
    document.getElementById('panels').innerHTML = `
      <div style="padding:40px; text-align:center; color:var(--text-dim); font-family:var(--font-mono); font-size:13px;">
        No se pudo cargar <b>data.json</b>.<br>
        Asegúrate de que ese archivo esté en la misma carpeta que este HTML.<br>
        <span style="color:var(--text-faint); font-size:11px;">(${err.message})</span>
      </div>`;
    return;
  }

  document.getElementById('brandSub').textContent = `Actualizado al ${DATA.meta.actualizado}`;
  document.getElementById('clockText').textContent = `HOY: ${fmtDateFull(DATA.meta.hoy)}`;
  renderKpis();
  renderTabs();

  const panelsHtml = `
    <div class="panel active" id="panel-resumen">${renderResumenPanel()}</div>
    <div class="panel" id="panel-mpo">${renderProjectPanel('mpo','Mall Plaza Oeste')}</div>
    <div class="panel" id="panel-mpn">${renderProjectPanel('mpn','Mall Plaza Norte')}</div>
    <div class="panel" id="panel-mpld">${renderProjectPanel('mpld','Mall Plaza Los Dominicos')}</div>
    <div class="panel" id="panel-escenarios">${renderEscenariosPanel()}</div>
  `;
  document.getElementById('panels').innerHTML = panelsHtml;
  document.querySelectorAll('.panel').forEach(p=>{ p.className = p.className.replace('active',''); });
  document.getElementById('panel-resumen').classList.add('active');
  document.querySelector('.tab-btn[data-tab="resumen"]').classList.add('active');

  wireFilters('mpo-cron', DATA.proyectos.mpo.cronograma);
  wireFilters('mpo-com', DATA.proyectos.mpo.comercial);
  wireFilters('mpn-cron', DATA.proyectos.mpn.cronograma);
  wireFilters('mpn-com', DATA.proyectos.mpn.comercial);
  wireFilters('mpld-cron', DATA.proyectos.mpld.cronograma);
  wireFilters('mpld-com', DATA.proyectos.mpld.comercial);
}
boot();
</script>
</body>
</html>
